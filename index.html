<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>スーパー割引計算機</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="割引計算機">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<main id="app">

  <!-- カテゴリ計算画面（グロッサリー／日配／パン共通テンプレート） -->
  <template id="calc-template">
    <section class="calc-screen">
      <div class="calc-results" data-role="results">
        <div class="result-tile result-tile--primary">
          <span class="result-pct" data-role="pct1">20%</span>
          <span class="result-price" data-role="value1">-</span>
        </div>
        <div class="result-tile">
          <span class="result-pct" data-role="pct2">30%</span>
          <span class="result-price" data-role="value2">-</span>
        </div>
        <div class="result-tile">
          <span class="result-pct" data-role="pct3">50%</span>
          <span class="result-price" data-role="value3">-</span>
        </div>
      </div>
      <div class="calc-display">
        <div class="calc-display-label">定価</div>
        <div class="calc-input" data-role="input">0</div>
      </div>
      <div class="keypad" data-role="keypad">
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key key-sub" data-key="clear">C</button>
        <button class="key" data-key="0">0</button>
        <button class="key key-sub" data-key="back">⌫</button>
      </div>
    </section>
  </template>

  <div id="screens"></div>

  <!-- 設定画面 -->
  <section id="screen-settings" class="screen settings-screen" hidden>
    <h1 class="settings-title">設定</h1>
    <div id="settings-body"></div>
    <p class="settings-note">設定はこの端末に保存されます。</p>
  </section>

  <nav class="tabbar">
    <button class="tab" data-tab="grocery">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 8.5h11l-1.3 11.2a2 2 0 0 1-2 1.8h-4.4a2 2 0 0 1-2-1.8z"/><path d="M6 8.5h12"/><path d="M13.5 8.5L15 2.5"/></svg>
      </span>
      <span class="tab-label">グロッサリー</span>
    </button>
    <button class="tab" data-tab="daily">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="7" width="15" height="12" rx="1.5"/><path d="M4.5 10.5h15"/><path d="M9 13.5v4M15 13.5v4"/></svg>
      </span>
      <span class="tab-label">日配</span>
    </button>
    <button class="tab" data-tab="bread">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11c0-4.5 3.2-8 8-8s8 3.5 8 8v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M8.5 11.5v5M12 11.5v5M15.5 11.5v5"/></svg>
      </span>
      <span class="tab-label">パン</span>
    </button>
    <button class="tab" data-tab="settings">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </span>
      <span class="tab-label">設定</span>
    </button>
  </nav>

</main>

<script src="app.js?v=3"></script>
</body>
</html>
